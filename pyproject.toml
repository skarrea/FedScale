[project]
name = "fedscale-umamba"
version = "0.1.0"
description = "U-Mamba models for prostate cancer detection in bi-parametric MRI"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gdown>=5.2,<7",
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "lightning==2.4.0",
    "monai==1.3.2",
    "munch>=4,<5",
    "nnunetv2==2.4.2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "picai-baseline>=0.8,<0.9",
    "picai-eval==1.4.5",
    "picai-prep>=2.1,<3",
    "pytorch-lightning==2.4.0",
    "seaborn>=0.13,<0.14",
    "torch==2.4.1",
    "torchmetrics==1.4.2",
    "torchvision==0.19.1",
    "tqdm>=4.66,<5",
    "wandb>=0.17,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_modules*"]
